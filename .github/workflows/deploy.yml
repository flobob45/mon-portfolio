name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Permissions nécessaires pour déployer sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ne permet qu'un déploiement concurrent
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job de vérification et build
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier que index.html existe
        run: |
          if [ ! -f index.html ]; then
            echo "❌ Erreur: index.html n'existe pas"
            exit 1
          fi
          echo "✅ index.html trouvé"

      - name: Valider la syntaxe CSS
        run: |
          echo "🔍 Validation CSS..."
          # Vérifier que les fichiers CSS existent
          if [ ! -f css/style.css ]; then
            echo "❌ Erreur: css/style.css n'existe pas"
            exit 1
          fi

          # Check basique : vérifier que les accolades sont équilibrées
          for css_file in css/*.css; do
            open_braces=$(grep -o '{' "$css_file" | wc -l)
            close_braces=$(grep -o '}' "$css_file" | wc -l)
            if [ "$open_braces" -ne "$close_braces" ]; then
              echo "❌ Erreur dans $css_file: accolades non équilibrées ($open_braces ouvertes, $close_braces fermées)"
              exit 1
            fi
            echo "✅ $css_file : syntaxe valide"
          done

      - name: Valider la syntaxe JavaScript
        run: |
          echo "🔍 Validation JavaScript..."
          # Installer Node.js pour utiliser --check
          sudo apt-get update -qq
          sudo apt-get install -y nodejs

          # Vérifier la syntaxe de tous les fichiers JS
          for js_file in js/*.js; do
            if [ -f "$js_file" ]; then
              node --check "$js_file"
              echo "✅ $js_file : syntaxe valide"
            fi
          done

      - name: Valider le HTML
        run: |
          echo "🔍 Validation HTML..."

          # Check basique : vérifier les balises courantes
          check_html_file() {
            local file=$1
            echo "Vérification de $file..."

            # Vérifier les balises HTML de base
            if ! grep -q '<html' "$file"; then
              echo "⚠️  Warning: pas de balise <html> dans $file"
            fi

            if ! grep -q '<head' "$file"; then
              echo "⚠️  Warning: pas de balise <head> dans $file"
            fi

            if ! grep -q '<body' "$file"; then
              echo "⚠️  Warning: pas de balise <body> dans $file"
            fi

            # Vérifier que les balises importantes sont fermées
            for tag in html head body main header footer nav section; do
              open_count=$(grep -oE "<$tag[ >]" "$file" | wc -l)
              close_count=$(grep -o "</$tag>" "$file" | wc -l)
              if [ "$open_count" -ne "$close_count" ]; then
                echo "❌ Erreur dans $file: balise <$tag> non équilibrée ($open_count ouvertes, $close_count fermées)"
                exit 1
              fi
            done

            echo "✅ $file : structure HTML valide"
          }

          # Vérifier tous les fichiers HTML
          check_html_file "index.html"

          if [ -d "blog" ]; then
            for html_file in blog/*.html; do
              if [ -f "$html_file" ]; then
                check_html_file "$html_file"
              fi
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Job de déploiement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
